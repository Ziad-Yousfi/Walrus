name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name override (e.g. 3.1.0.1, or leave empty to use Version.kt)'
        required: false
        default: ''
      release_title:
        description: 'Release Title override (optional)'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes in Markdown (optional)'
        required: false
        default: ''
      publish_release:
        description: 'Publish as GitHub Release? (Uncheck for artifacts only)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - uses: gradle/actions/setup-gradle@v4
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
        build-scan-terms-of-use-agree: "yes"

    - name: Prepare Signing Keystore
      env:
        ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        KEYSTORE_PATH="${{ github.workspace }}/walrus-release.jks"
        if [ -n "$ANDROID_SIGNING_KEY" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
          echo "Using configured repository signing key from secrets..."
          echo "$ANDROID_SIGNING_KEY" | tr -d '\n\r ' | base64 --decode > "$KEYSTORE_PATH"
          echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=${ANDROID_ALIAS:-walrus}" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
        else
          echo "No signing secret found in fork repository. Generating a dedicated Walrus release key..."
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias walrus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "walrus_release_key_2026" \
            -keypass "walrus_release_key_2026" \
            -dname "CN=Walrus, OU=WalrusApp, O=Walrus, L=Default, S=Default, C=US"
          echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "SIGNING_STORE_PASSWORD=walrus_release_key_2026" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=walrus" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=walrus_release_key_2026" >> $GITHUB_ENV
        fi

    - name: Determine Version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version_name }}" ]; then
          VERSION="${{ github.event.inputs.version_name }}"
          echo "Using version override from inputs: ${VERSION}"
        else
          chmod +x ./gradlew
          VERSION=$(./gradlew -q :app:printVersionName | tail -n 1 | tr -d '\r\n')
          echo "Using version resolved by Gradle: ${VERSION}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

    - name: Build and Sign Release APKs
      run: |
        ./gradlew assembleRelease --parallel --build-cache --no-daemon \
          -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE" \
          -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
          -PcustomVersionName="${{ steps.version.outputs.VERSION }}"

    - name: Read release configuration
      id: release_config
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.publish_release }}" ]; then
          SHOULD_RELEASE="${{ github.event.inputs.publish_release }}"
        else
          SHOULD_RELEASE=$(jq -r '.release' release.json)
        fi
        echo "SHOULD_RELEASE=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
        echo "Release flag: ${SHOULD_RELEASE}"
        if [ "${SHOULD_RELEASE}" = "true" ]; then
          echo "✨ Release will be published"
        else
          echo "📦 Release publishing is disabled - APKs will be uploaded as artifacts only"
        fi

    - name: List all APK files for debugging
      run: |
        echo "📦 All APK files in output directory:"
        find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
        echo ""
        echo "📁 Directory structure:"
        ls -R app/build/outputs/apk/

    - name: Prepare Release Notes
      id: notes
      run: |
        TITLE="${{ github.event.inputs.release_title }}"
        if [ -z "$TITLE" ]; then
          TITLE="Walrus v${{ steps.version.outputs.VERSION }}"
        fi
        echo "RELEASE_TITLE=${TITLE}" >> $GITHUB_OUTPUT

        if [ -n "${{ github.event.inputs.release_notes }}" ]; then
          cat << 'EOF' > release_body.md
${{ github.event.inputs.release_notes }}
EOF
        else
          cat << 'EOF' > release_body.md
## ✨ Walrus v${{ steps.version.outputs.VERSION }}

---

### 🌟 Highlights
* Customized release of **Walrus** by **fernstack**.
* Up-to-date yt-dlp core extractor engines.
* Enhanced UI, stability, and download capabilities.

### 📦 Installation
Download the appropriate APK for your device:
- **Universal APK**: Compatible with all devices (recommended)
- **arm64-v8a**: For 64-bit ARM devices (most modern phones)
- **armeabi-v7a**: For 32-bit ARM devices
- **x86_64**: For 64-bit x86 devices / emulators
- **x86**: For 32-bit x86 devices / emulators

### 📜 Source & Details
- Repository: [Ziad-Yousfi/Walrus](https://github.com/Ziad-Yousfi/Walrus)
- Developer: [fernstack](https://github.com/Ziad-Yousfi)

---
*Built on: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}*
*Commit: ${{ github.sha }}*
EOF
        fi

    - name: Create Release
      if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: ${{ steps.notes.outputs.RELEASE_TITLE }}
        body_path: release_body.md
        draft: false
        prerelease: false
        make_latest: true
        files: |
          app/build/outputs/apk/generic/release/*.apk

    - name: Send Telegram Notification to Channel
      if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
      continue-on-error: true
      env:
        TGTOKEN: ${{ secrets.TGTOKEN }}
        TGCHANNEL: ${{ secrets.TGCHANNEL }}
      run: |
        # Skip if Telegram credentials are not configured
        if [ -z "$TGTOKEN" ] || [ -z "$TGCHANNEL" ]; then
          echo "?? Telegram notification skipped (TGTOKEN or TGCHANNEL not configured)"
          exit 0
        fi
        
        echo "? Sending notification to Telegram Channel: $TGCHANNEL"
        
        # Prepare the release URL
        RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"
        
        # Create a beautiful Telegram message with HTML formatting
        MESSAGE="<b>🎉 New Release Available!</b> 🚀\n\n"
        MESSAGE+="━━━━━━━━━━━━━━━━━━━━━━━\n\n"
        MESSAGE+="📱 <b>App Name:</b> Walrus\n\n"
        MESSAGE+="🏷️ <b>Version:</b> v${{ steps.version.outputs.VERSION }}\n\n"
        MESSAGE+="━━━━━━━━━━━━━━━━━━━━━━━\n\n"
        MESSAGE+="📋 <b>Changelog (v3.1):</b>\n\n"
        MESSAGE+="<b>🔁 Retry All &amp; Queue Recovery</b>\n"
        MESSAGE+="  ➤ Retry All button on Home for canceled/failed tasks\n"
        MESSAGE+="  ➤ Queued tasks survive force-stop instead of failing\n\n"
        MESSAGE+="<b>🎬 Download Fixes</b>\n"
        MESSAGE+="  ➤ Custom video formats download video correctly (thanks @ptgullas)\n"
        MESSAGE+="  ➤ MP4 output for merged videos\n"
        MESSAGE+="  ➤ Configure switch respected in Quick Download and share\n"
        MESSAGE+="  ➤ Custom output templates no longer need .%(ext)s\n"
        MESSAGE+="  ➤ Douyin login opens as desktop session\n\n"
        MESSAGE+="<b>🔋 Battery &amp; Stability</b>\n"
        MESSAGE+="  ➤ Hide battery reminder option in General settings\n"
        MESSAGE+="  ➤ HarmonyOS 4.x battery settings crash fixed\n"
        MESSAGE+="  ➤ Smoother progress on OEM ROMs, crash &amp; memory hardening\n\n"
        MESSAGE+="<b>💖 Donations</b>\n"
        MESSAGE+="  ➤ Trust Wallet deep link &amp; QR code, new sponsors\n\n"
        MESSAGE+="━━━━━━━━━━━━━━━━━━━━━━━\n\n"
        MESSAGE+="✨ <b>Key Features (v3.1):</b>\n"
        MESSAGE+="🔁 Retry All — Restart canceled/failed downloads in one tap\n"
        MESSAGE+="🎬 Custom Formats — Video downloads fixed (PR #29)\n"
        MESSAGE+="🔋 Hide Battery Reminder — Opt-out in settings\n"
        MESSAGE+="🌐 1000+ sites via yt-dlp\n\n"
        MESSAGE+="━━━━━━━━━━━━━━━━━━━━━━━\n\n"
        MESSAGE+="💡 <b>Note:</b> v3.1 adds Retry All on the home screen, fixes custom video format downloads, keeps queued tasks after restarts, adds a battery reminder opt-out, and fixes the HarmonyOS battery crash.\n\n"
        MESSAGE+="🕐 <i>Released: $(date '+%B %d, %Y at %H:%M UTC')</i>"
        
        # URL encode the message to avoid HTML parsing issues
        MESSAGE_ENCODED=$(echo -ne "$MESSAGE" | jq -sRr @uri)
        
        # Send ONLY to Channel
        curl -s -X POST "https://api.telegram.org/bot${TGTOKEN}/sendMessage" \
          -d "chat_id=${TGCHANNEL}" \
          -d "text=${MESSAGE_ENCODED}" \
          -d "parse_mode=HTML" \
          -d "disable_web_page_preview=false" \
          && echo "? Telegram Channel notification sent successfully!" \
          || echo "? Failed to send Telegram notification"

    - name: Upload Universal APK as Artifact
      if: steps.release_config.outputs.SHOULD_RELEASE == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Walrus-${{ steps.version.outputs.VERSION }}-universal
        path: app/build/outputs/apk/generic/release/*universal*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload arm64-v8a APK as Artifact
      if: steps.release_config.outputs.SHOULD_RELEASE == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Walrus-${{ steps.version.outputs.VERSION }}-arm64-v8a
        path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload armeabi-v7a APK as Artifact
      if: steps.release_config.outputs.SHOULD_RELEASE == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Walrus-${{ steps.version.outputs.VERSION }}-armeabi-v7a
        path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload x86_64 APK as Artifact
      if: steps.release_config.outputs.SHOULD_RELEASE == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Walrus-${{ steps.version.outputs.VERSION }}-x86_64
        path: app/build/outputs/apk/generic/release/*x86_64*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload x86 APK as Artifact
      if: steps.release_config.outputs.SHOULD_RELEASE == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Walrus-${{ steps.version.outputs.VERSION }}-x86
        # NOTE: must be "*-x86.apk", not "*x86*.apk" — the latter also matches
        # "...-x86_64.apk" (substring collision), which bundled the x86_64 APK
        # into the "x86" artifact as well.
        path: app/build/outputs/apk/generic/release/*-x86.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload Artifacts (Backup - Always)
      if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks-backup
        path: app/build/outputs/apk/generic/release/*.apk
        if-no-files-found: error
        retention-days: 20